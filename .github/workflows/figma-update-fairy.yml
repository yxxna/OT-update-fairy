name: Figma Update Fairy (Team)

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다 (GitHub Actions cron 최소 간격)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: figma-update-fairy-state
  cancel-in-progress: false
  # ✅ 이유: "누락 없이"가 목표면, 실행 중간에 취소되면 Slack 실패/커밋 실패로 누락 위험이 커짐.
  #          느려도 끝까지 가게 두는 게 안정적.

jobs:
  scan-team-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check jq
        run: jq --version

      - name: Scan team files for labeled/desc versions (no-miss)
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_TEAM_ID: ${{ secrets.FIGMA_TEAM_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          mkdir -p state

          # ✅ "이미 Slack으로 보낸 version-id"만 저장 (누락 방지 핵심)
          NOTIFIED_FILE="state/team_notified_versions.json"
          if [ ! -f "$NOTIFIED_FILE" ]; then
            echo '{}' > "$NOTIFIED_FILE"
          fi

          # ✅ 이번 실행에서 새로 보낼 건들 (Slack 전송 성공 후에만 NOTIFIED에 합칠 거라서)
          PENDING_FILE="state/pending_notified.json"
          echo '{}' > "$PENDING_FILE"

          # ✅ Slack 본문 생성용
          CHANGES_FILE="state/changes.json"
          echo '[]' > "$CHANGES_FILE"

          auth_header="X-FIGMA-TOKEN: $FIGMA_TOKEN"

          # ✅ 이 cron이 유일한 알림 경로. 5분마다 "오늘(KST) 생성된 새 버전"만 보면 되므로
          #    최근 몇 페이지만 확인하면 충분함.
          #    ("라벨 나중에 달기" 지원은 제거했으므로 깊게 재스캔할 필요 없음)
          N=100
          MAX_PAGES=2   # 최근 200개 버전까지만 확인 (당일 신규는 충분히 커버)
          # ✅ 오늘(KST) 00:00 ~ 내일(KST) 00:00 범위만 알림 대상으로 필터링
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          START_EPOCH=$(date -u -d "${TODAY_KST} 00:00:00 +0900" +%s)
          END_EPOCH=$((START_EPOCH + 86400))
          
          echo "KST today=$TODAY_KST start_epoch=$START_EPOCH end_epoch=$END_EPOCH"

          projects_json=$(curl -sS -H "$auth_header" "https://api.figma.com/v1/teams/$FIGMA_TEAM_ID/projects")
          project_ids=$(echo "$projects_json" | jq -r '.projects[]?.id')

          if [ -z "${project_ids:-}" ]; then
            echo "❌ 팀 프로젝트를 못 가져왔음. 팀ID/토큰 권한 확인 필요."
            echo "$projects_json"
            exit 1
          fi

          for pid in $project_ids; do
            files_json=$(curl -sS -H "$auth_header" "https://api.figma.com/v1/projects/$pid/files")
            keys=$(echo "$files_json" | jq -r '.files[]?.key')

            for key in $keys; do
              name=$(echo "$files_json" | jq -r --arg k "$key" '.files[] | select(.key==$k) | .name')
              link_base="https://www.figma.com/file/$key"

              # 이 파일에서 이미 보낸 버전 id set
              notified=$(jq -c --arg k "$key" '.[$k] // {}' "$NOTIFIED_FILE")

              url="https://api.figma.com/v1/files/$key/versions?page_size=$N"
              page=1

              while [ -n "${url:-}" ] && [ "$page" -le "$MAX_PAGES" ]; do
                echo "DEBUG url(before)=[$url]"
                # ✅ 공백/특수문자 때문에 curl이 터지는 걸 막기 위해 URL 인코딩해서 curl에만 사용
                curl_url=$(python3 -c 'import sys,urllib.parse as u; print(u.quote(sys.argv[1], safe=":/?&=%+"))' "$url")
                echo "DEBUG url(after)=[$curl_url]"
                versions=$(curl -sS -H "$auth_header" "$curl_url")

                # ✅ 라벨/설명 있는 버전만 + 아직 안 보낸 버전만
                 new_versions=$(echo "$versions" | jq -c \
                  --argjson notified "$notified" \
                  --argjson start "$START_EPOCH" \
                  --argjson end "$END_EPOCH" '
                  [ .versions[]?
                    | select(((.label // "")|length > 0) and ((.description // "")|length > 0))
                
                    # ✅ 오늘(KST) 생성된 버전만
                    | select((.created_at // "") != "")
                    | (.created_at | fromdateiso8601) as $ts
                    | select($ts >= $start and $ts < $end)
                
                    # ✅ 아직 Slack으로 안 보낸 것만
                    | select(($notified[.id] // false) | not)
                
                    | {
                        id: .id,
                        label: (.label // ""),
                        description: (.description // ""),
                        created_at: (.created_at // ""),
                        user: (.user.handle // .user.email // "")
                      }
                  ]
                ')
                new_count=$(echo "$new_versions" | jq 'length')

                if [ "$new_count" -gt 0 ]; then
                  # Slack에 보낼 리스트에 추가
                  tmp2=$(mktemp)
                  jq --arg file_name "$name" \
                     --arg file_key "$key" \
                     --arg link_base "$link_base" \
                     --argjson nv "$new_versions" \
                     '
                     . + ( $nv | map(. + {
                       file_name: $file_name,
                       file_key: $file_key,
                       link: ($link_base + "?version-id=" + .id)
                     }))
                     ' "$CHANGES_FILE" > "$tmp2"
                  mv "$tmp2" "$CHANGES_FILE"

                  # ✅ PENDING에만 기록 (Slack 성공 후 NOTIFIED에 합칠 거임)
                  tmp3=$(mktemp)
                  jq --arg k "$key" --argjson nv "$new_versions" '
                    . as $root
                    | ($root[$k] // {}) as $old
                    | ($nv | reduce .[] as $v ($old; . + {($v.id): true})) as $merged
                    | $root + {($k): $merged}
                  ' "$PENDING_FILE" > "$tmp3"
                  mv "$tmp3" "$PENDING_FILE"
                fi

                # ✅ 다음 페이지(더 과거)로 이동 - next_page 포맷이 이상할 때 curl이 터지는 걸 방지
                next=$(echo "$versions" | jq -r '.pagination.next_page // empty')
                next=$(printf '%s' "$next" | tr -d '\r\n')  # 혹시 모를 개행/CR 제거
                
                case "$next" in
                  "")
                    url=""
                    ;;
                  http://*|https://*)
                    url="$next"
                    ;;
                  /*)
                    url="https://api.figma.com$next"
                    ;;
                  v1/*)
                    url="https://api.figma.com/$next"
                    ;;
                  *)
                    echo "⚠️ next_page 포맷이 예상과 다름: [$next] (페이지 이동 중단)"
                    url=""
                    ;;
                esac

                page=$((page + 1))
                # API에 너무 빡세게 달려들지 말자(레이트리밋 완화)
                sleep 0.1
              done
            done
          done

          count=$(jq 'length' "$CHANGES_FILE")
          echo "changed_count=$count" >> $GITHUB_ENV

      - name: Post to Slack (Incoming Webhook)
        if: ${{ env.changed_count != '0' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          total=$(jq 'length' state/changes.json)

          # 오늘 변경이 0이면 그냥 조용히 종료
          if [ "$total" -eq 0 ]; then
            echo "No changes to post."
            exit 0
          fi

          # ✅ 오래된 것부터(시간순) 정렬 → 채널에 발생 순서대로 보이게
          sorted_tmp=$(mktemp)
          jq 'sort_by(.created_at // "")' state/changes.json > "$sorted_tmp"
          count=$(jq 'length' "$sorted_tmp")

          # ✅ 묶음 전송 대신 1건씩 전송 (여러 개가 한꺼번에 오지 않도록)
          for i in $(seq 0 $((count - 1))); do
            text=$(jq -r --argjson i "$i" '
              .[$i] |
              "🧚‍♀️ *Figma 업데이트 감지*\n\n" +
              "• 파일 : " + (.file_name // "-") + "\n" +
              "• 버전 : " + (if ((.label // "")|length) > 0 then .label else "-" end) + "\n" +
              "• 수정시각 : " +
                (
                  if ((.created_at // "") | length) > 0 then
                    (
                      ((.created_at | fromdateiso8601) + 32400)
                      | strftime("%Y-%m-%d %H:%M:%S")
                    ) + " KST"
                  else
                    "-"
                  end
                ) + "\n" +
              "• 내용 : " +
                (
                  if ((.description // "")|length) > 0 then
                    (
                      (.description // "")
                      | gsub("\r\n";"\n")
                      | split("\n")
                      | map(select(length > 0))
                      | .[0:3]
                      | join(" / ")
                      | (if length > 200 then .[0:200] + "…" else . end)
                    )
                  else
                    "-"
                  end
                ) + "\n" +
              "• 작성자 : " + (.user // "-") + "\n" +
              "• 링크 : " + (.link // "-")
            ' "$sorted_tmp")

            # ✅ Slack 전송 (실패하면 워크플로우 실패로 처리 → notified에 기록 안 됨)
            curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
              --data "$(jq -n --arg t "$text" '{text:$t}')" \
              "$SLACK_WEBHOOK_URL"

            # 너무 연달아 보내면 Slack이 삐질 수 있어서 약간 쉬기
            sleep 0.3
          done

          rm -f "$sorted_tmp"

      - name: Mark versions as notified (after Slack success)
        if: ${{ env.changed_count != '0' }}
        run: |
          set -euo pipefail
          NOTIFIED_FILE="state/team_notified_versions.json"
          PENDING_FILE="state/pending_notified.json"

          tmp=$(mktemp)
          jq --slurp '
            .[0] as $n | .[1] as $p |
            reduce ($p|to_entries[]) as $e ($n;
              . + { ($e.key): ((.[ $e.key ] // {}) + ($e.value // {})) }
            )
          ' "$NOTIFIED_FILE" "$PENDING_FILE" > "$tmp"
          mv "$tmp" "$NOTIFIED_FILE"

          # repo에 남길 필요 없음
          rm -f "$PENDING_FILE"

          # changes.json도 굳이 커밋에 남기고 싶지 않으면 초기화
          echo '[]' > state/changes.json

      - name: Commit state
        run: |
          set -euo pipefail
          git config user.name "figma-team-update-fairy"
          git config user.email "actions@users.noreply.github.com"

          git add state/team_notified_versions.json state/changes.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update figma notified state" || exit 0

          git pull --rebase origin main
          git push origin HEAD:main
