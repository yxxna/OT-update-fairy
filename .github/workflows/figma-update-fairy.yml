name: Figma Update Fairy (Team)

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다
  workflow_dispatch: {}

permissions:
  contents: write
  
concurrency:
  group: figma-update-fairy-state
  cancel-in-progress: false

jobs:
  scan-team-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Scan team files for new versions
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_TEAM_ID: ${{ secrets.FIGMA_TEAM_ID }}
        run: |
          set -euo pipefail

          mkdir -p state
          STATE_FILE="state/team_last_versions.json"
          CHANGES_FILE="state/changes.json"

          if [ ! -f "$STATE_FILE" ]; then
            echo '{}' > "$STATE_FILE"
          fi
          echo '[]' > "$CHANGES_FILE"

          auth_header="X-FIGMA-TOKEN: $FIGMA_TOKEN"
          N=50

          projects_json=$(curl -sS -H "$auth_header" "https://api.figma.com/v1/teams/$FIGMA_TEAM_ID/projects")
          project_ids=$(echo "$projects_json" | jq -r '.projects[]?.id')

          if [ -z "${project_ids:-}" ]; then
            echo "❌ 팀 프로젝트를 못 가져왔음. 팀ID/토큰 권한 확인 필요."
            echo "$projects_json"
            exit 1
          fi

          for pid in $project_ids; do
            files_json=$(curl -sS -H "$auth_header" "https://api.figma.com/v1/projects/$pid/files")
            keys=$(echo "$files_json" | jq -r '.files[]?.key')

            for key in $keys; do
              name=$(echo "$files_json" | jq -r --arg k "$key" '.files[] | select(.key==$k) | .name')

              versions=$(curl -sS -H "$auth_header" "https://api.figma.com/v1/files/$key/versions?page_size=$N")
              latest_id=$(echo "$versions" | jq -r '.versions[0].id // empty')

              if [ -z "$latest_id" ]; then
                continue
              fi

              prev_id=$(jq -r --arg k "$key" '.[$k] // ""' "$STATE_FILE")

              # 첫 실행/새 파일은 기준점만 저장 (도배 방지)
              if [ -z "$prev_id" ]; then
                tmp=$(mktemp)
                jq --arg k "$key" --arg v "$latest_id" '. + {($k): $v}' "$STATE_FILE" > "$tmp"
                mv "$tmp" "$STATE_FILE"
                continue
              fi

              new_versions=$(echo "$versions" | jq -c --arg prev "$prev_id" '
                reduce .versions[] as $v ({hit:false, out:[]};
                  if .hit then .
                  elif ($v.id == $prev) then .hit=true
                  else
                    # ✅ label/description 있는 버전만 알림 대상으로 수집
                    if ((($v.label // "")|length > 0) or (($v.description // "")|length > 0)) then
                      .out += [{
                        id: $v.id,
                        label: ($v.label // ""),
                        description: ($v.description // ""),
                        created_at: ($v.created_at // ""),
                        user: ($v.user.handle // $v.user.email // "")
                      }]
                    else
                      .
                    end
                  end
                ) | .out
              ')

              new_count=$(echo "$new_versions" | jq 'length')

              # ✅ 최신 버전 id는 항상 저장 (알림 대상이 없어도 저장해야 반복 알림이 안 남)
              if [ "$latest_id" != "$prev_id" ]; then
                tmp=$(mktemp)
                jq --arg k "$key" --arg v "$latest_id" '. + {($k): $v}' "$STATE_FILE" > "$tmp"
                mv "$tmp" "$STATE_FILE"
              fi
              
              # ✅ 알림은 "라벨/내용 있는 버전"이 있을 때만 changes에 추가
              if [ "$new_count" -gt 0 ]; then
                link_base="https://www.figma.com/file/$key"
              
                tmp2=$(mktemp)
                jq --arg file_name "$name" \
                   --arg file_key "$key" \
                   --arg link_base "$link_base" \
                   --argjson nv "$new_versions" \
                   '
                   . + ( $nv | map(. + {
                     file_name: $file_name,
                     file_key: $file_key,
                     link: ($link_base + "?version-id=" + .id)
                   }))
                   ' "$CHANGES_FILE" > "$tmp2"
                mv "$tmp2" "$CHANGES_FILE"
              fi
            done
          done

          count=$(jq 'length' "$CHANGES_FILE")
          echo "changed_count=$count" >> $GITHUB_ENV

      - name: Post to Slack (Incoming Webhook)
        if: ${{ env.changed_count != '0' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
            set -euo pipefail
            total=$(jq 'length' state/changes.json)
            
            # 너무 길면 Slack이 보기 싫어하니까 상위 10개까지만 보여줌
            SHOW=10
            head=$(jq -c --argjson n $SHOW '.[0:$n]' state/changes.json)
            rest=$(( total - SHOW ))
            if [ $rest -lt 0 ]; then rest=0; fi
            
            lines=$(echo "$head" | jq -r '
              .[] |
              (
                "  - 파일 : " + (.file_name // "-") + "\n" +
                "  - 버전 : " + (if ((.label // "")|length) > 0 then .label else "-" end) + "\n" +
                "  - 내용 : " +
                  (if ((.description // "")|length) > 0 then
                     ("\n" + ((.description // "") | gsub("\r\n";"\n") | split("\n") | map("    " + .) | join("\n")))
                   else
                     "-"
                   end) + "\n" +
                "  - 작성자 : " + (.user // "-") + "\n" +
                "  - 링크 : " + (.link // "-")
              )
            ')
            
            if [ $rest -gt 0 ]; then
              lines="$lines\n\n…외 ${rest}건 더 있음"
            fi
            
            text="🧚‍♀️ *Figma 팀 업데이트 감지* (새 버전 ${total}건)
            
            $lines"
            
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "$(jq -n --arg t "$text" '{text:$t}')" \
              "$SLACK_WEBHOOK_URL"

      - name: Commit state
        run: |
            set -euo pipefail
            git config user.name "figma-team-update-fairy"
            git config user.email "actions@users.noreply.github.com"
        
            git add state/team_last_versions.json state/changes.json
        
            # 변경 없으면 종료
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
        
            git commit -m "chore: update figma state" || exit 0
        
            # 최신 main 반영 후 push (충돌/락 방지)
            git pull --rebase origin main
            git push origin HEAD:main
