name: _debug versions (temp)

on:
  workflow_dispatch:
    inputs:
      file_key:
        description: "Figma file key"
        required: true
        default: "y8KIpTfBiOQANWcATfWT3u"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump recent versions + filter check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set -euo pipefail
          KEY="${{ github.event.inputs.file_key }}"

          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          START_EPOCH=$(date -u -d "${TODAY_KST} 00:00:00 +0900" +%s)
          END_EPOCH=$((START_EPOCH + 86400))
          echo "오늘(KST)=$TODAY_KST  window=[$START_EPOCH, $END_EPOCH)"
          echo "지금(UTC)=$(date -u +%FT%TZ)"
          echo "=================================================="

          resp=$(curl -sS -H "X-FIGMA-TOKEN: $FIGMA_TOKEN" \
            "https://api.figma.com/v1/files/${KEY}/versions?page_size=8")

          echo "$resp" | jq -r --argjson start "$START_EPOCH" --argjson end "$END_EPOCH" '
            .versions[]? |
            {
              id: .id,
              label: (.label // null),
              description: (.description // null),
              created_at: .created_at,
              has_label: ((.label // "")|length > 0),
              has_desc:  ((.description // "")|length > 0),
              in_today: (((.created_at // "")|length>0) and ((.created_at|fromdateiso8601) >= $start) and ((.created_at|fromdateiso8601) < $end))
            }
          '
